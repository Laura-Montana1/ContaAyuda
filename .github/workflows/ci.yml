name: Conta Ayuda - CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov bandit safety
    
    - name: Ejecutar pruebas unitarias
      run: |
        pytest tests/unit/ -v -m "not slow"
    
    - name: Ejecutar pruebas de integración
      run: |
        pytest tests/integration/ -v
    
    - name: Ejecutar pruebas de sistema
      run: |
        pytest tests/system/ -v
    
    - name: Análisis estático con Bandit
      run: |
        bandit -r app/ -ll -f json -o bandit_report.json
      continue-on-error: true
    
    - name: Verificar dependencias con Safety
      run: |
        safety check --full-report
    
    - name: Subir reporte de Bandit
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report-${{ matrix.python-version }}
        path: bandit_report.json
    
    - name: Ejecutar pruebas de regresión
      run: |
        pytest tests/regression/ -v -m regression

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar Bandit
      run: pip install bandit
    
    - name: Escaneo de seguridad completo
      run: |
        bandit -r app/ -f html -o bandit_full_report.html
    
    - name: Subir reporte completo
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit_full_report.html

  dependency-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Escaneo de dependencias con Safety
      run: |
        pip install safety
        safety check -r requirements.txt --full-report